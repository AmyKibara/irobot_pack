name: Build and Push Native ARM64 Benchmark Image to Docker Hub

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-24.04-arm # Uses native GitHub ARM64 servers
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Tags it directly under your Docker Hub namespace
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/irobot-benchmark:latest

      - name: Quick Sanity Verification
        run: |
          docker run --rm ${{ secrets.DOCKERHUB_USERNAME }}/irobot-benchmark:latest \
          bash -c "ros2 run rmw_implementation_viewer rmw_implementation_viewer"
